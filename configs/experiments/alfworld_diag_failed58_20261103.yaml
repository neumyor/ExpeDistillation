weak_profile: "# ALFWorld unified protocol: the reader's execution context\n\nThe\
  \ reader executes one ALFWorld task under the benchmark's unified\nprotocol. At\
  \ every decision step its entire context is exactly:\n\n1. the current observation\
  \ (the environment text it received just now);\n2. the last two (observation, action)\
  \ pairs, verbatim -- anything older has\n   left the context;\n3. the \"Opened skill\
  \ cards\" block: the full text of every skill card the\n   reader opened in this\
  \ episode, kept verbatim until the episode ends.\n\nOpening a card does not take\
  \ one of those two interaction slots. It is not\na game action: the card text simply\
  \ appears in the opened-cards block.\n\nThe reader does NOT see: the initial room\
  \ description after the second\naction, any interaction older than the last two,\
  \ any skill card it has not\nopened, a separate copy of the task instruction, or\
  \ a plan it wrote in an\nearlier step.\n\n## What every written procedure must respect\n\
  \n- Every node in [Steps] must be executable from those three sources alone at\n\
  \  the moment it fires.\n- Never refer to an earlier step by position (\"the object\
  \ you saw two steps\n  ago\", \"as established above\", \"the location from your\
  \ first look\"): that\n  interaction is gone.\n- Never assume the reader still remembers\
  \ the initial room listing or the\n  full instruction. A node that needs a fact\
  \ must say how to re-observe it\n  in that same node: look, open the receptacle,\
  \ check the inventory.\n- A fact stated in this card stays available while the card\
  \ is open, so a\n  card may carry a short list of object names, locations or inventory\
  \ it\n  wants the reader to keep using. It must still say how to obtain a fact\n\
  \  that is neither in the card nor in the current observation.\n- Prefer one self-contained\
  \ action per node over a long ordered plan whose\n  later nodes depend on state\
  \ the reader can no longer see.\n- The reader can run at most one environment action\
  \ per step; a procedure\n  that needs several observations must say what to check\
  \ at each one.\n\nThe reader is also a weaker model: short sentences, one action\
  \ per node,\nexplicit order, concrete observable conditions.\n\n## Length and memory\
  \ discipline when combining cards\n\n- Keep every card short. Aim for 1,500 to 2,500\
  \ characters. A merged card\n  that is longer than its sources is almost certainly\
  \ repeating them.\n- When several cards teach the same situation, keep the shared\
  \ procedure\n  and drop the repeated advice. Do not paste whole sections together.\n\
  - Never write a step that needs a fact from an earlier step, or a list the\n  reader\
  \ was asked to maintain. The reader has nowhere to keep it: each\n  node must re-observe\
  \ what it needs and must stand on its own.\n- Prefer a few complete nodes over many\
  \ truncated ones. If the advice does\n  not fit, drop the least important advice\
  \ rather than compressing every\n  sentence.\n\n## Shortening may not remove search\
  \ coverage\n\nLength is a target, coverage is a requirement. When a card says where\
  \ or\nhow to look for something, that text stays, even if the card grows past\n\
  the target:\n\n- Keep every search and fallback step a source card states: which\
  \ places\n  to check, how to check a closed container, when to move to another piece\n\
  \  of furniture or room, and what to do when the first attempt fails.\n- Keep every\
  \ category of location the sources name. Do not narrow \"surface,\n  container,\
  \ or place\" to \"receptacle or surface\": an object can be on a\n  bed, a sofa,\
  \ a shelf, or any other named furniture. A card that searches\n  only the current\
  \ observation's containers is a defect.\n- Keep every action command the sources\
  \ use (open, examine, go to, take,\n  use, move) and the exact command shape. A\
  \ paraphrase such as \"look at the\n  receptacles\" is not an executable command;\
  \ write \"go to X, open X,\n  examine X\".\n- Shorten by removing repeated wording\
  \ and redundant explanations, never by\n  deleting a step, a location category,\
  \ or an action.\n"
use_weak_profile: true
n_attempts_strong: 3
n_attempts_weak: 3
