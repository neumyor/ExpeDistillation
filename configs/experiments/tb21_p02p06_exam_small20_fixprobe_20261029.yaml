use_weak_profile: true
weak_profile: 'qwen3.6-flash-distill is a small, fast, distilled terminal agent: in
  the

  TB2.1 campaign over these 89 tasks it solved 47% of attempts on average

  (avg@5 0.4697) against the strong model''s 63%. Its terminal interaction is

  fragile: 11 of its 13 kept-as-model-failure trials died in the tmux keystroke

  layer (unparseable command rounds, or keystrokes fired before tmux was even

  installed), two more overran the agent time cap (AgentTimeoutError), and it

  intermittently emits unparseable output turns that waste interaction rounds.

  When it does run to completion it writes plausible-looking but subtly wrong

  numerical or statistical code and declares success without validating the

  result against the task''s tests, so skills should give exact commands,

  concrete verification steps, and explicit guards against its early-exit habit.'
