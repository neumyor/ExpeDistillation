models:
  executor_strong: deepseek-v4-flash-0731--ali
  executor_weak: qwen3.6-flash-distill
weak_profile: |-
  qwen3.6-flash-distill is a small, fast, distilled terminal agent: in the
  TB2.1 campaign over these 89 tasks it solved 47% of attempts on average
  (avg@5 0.4697) against the strong model's 63%. Its terminal interaction is
  fragile: 11 of its 13 kept-as-model-failure trials died in the tmux keystroke
  layer (unparseable command rounds, or keystrokes fired before tmux was even
  installed), two more overran the agent time cap (AgentTimeoutError), and it
  intermittently emits unparseable output turns that waste interaction rounds.
  When it does run to completion it writes plausible-looking but subtly wrong
  numerical or statistical code and declares success without validating the
  result against the task's tests, so skills should give exact commands,
  concrete verification steps, and explicit guards against its early-exit habit.
n_attempts_strong: 3
n_attempts_weak: 3
K: 5
segment_retry_limit: 2
retry_limit: 2
# Sized to the real bank (2026-10-12 decision: 102 members ~ 80k est-tokens,
# merges compress ~0.98 by prompt contract, 4096 was a pilot placeholder that
# mathematically cannot be met; see docs/decisions/bank_token_budget_20261012.md)
bank_token_budget: 96000
curation_rounds: 3
rules:
  # Protocol v2 rule names (docs/decisions/stage23_protocol_v2_20261013.md):
  # F = train-41 tasks with any weak failure = 28 under any_weak_failed;
  # the v1 names of tb21_full_v2.yaml stay registered for the historical
  # configs but do not run here (new protocol = new experiment).
  task_select: any_weak_failed
  segment_select: strong_success_weak_failed
  trajectory_select: strong2_weak2
skill_delivery:
  # Retrieval-based per-task skill selection at test time (protocol v2 /
  # the retrieval split). min_score 0.02 is a PLACEHOLDER, not frozen:
  # before the 168-game launch, gate 4 of the acceptance sequence
  # (retrieval preflight, zero executions) re-probes select_skills on
  # the 48 test+validation tasks ON THE NEW v2 BANK (bank scale to be
  # measured at stage 5) and freezes the value per the pre-registered
  # protocol in docs/decisions/retrieval_delivery_tb_split_20261013.md
  # section 0 ruling 8: the smallest grid value in {0.02, 0.05, 0.10}
  # that excludes every zero-overlap task. The tb21_split_reuse.yaml
  # probe does NOT carry over -- IDF scales with the bank.
  mode: retrieval
  top_k: 5
  max_categories: 3
  min_score: 0.02
model_options:
  deepseek-v4-flash-0731--ali:
    # Output budgets moved to token_budgets below (2026-10-12
    # behavior-preserving migration); only generation-behavior
    # parameters stay here.
    reasoning_effort: max
token_budgets:
  # Output budgets by role. Behavior-preserving migration (2026-10-12):
  # strong-model roles carried 65536 (pre-registered 2026-10-12 after G7
  # burned 32768 twice); qwen roles requested 5120 today (the endpoint
  # ignores it -- usage meta cap_violation will keep flagging, which is
  # the evidence we want). Input: measure-only in v1 (no thresholds).
  default_max_output_tokens: 65536
  max_input_tokens: null
  roles:
    executor_strong: {max_output_tokens: 65536}
    segmenter:       {max_output_tokens: 65536}
    author:          {max_output_tokens: 65536}
    examiner:        {max_output_tokens: 65536}
    judge:           {max_output_tokens: 65536}
    rewriter:        {max_output_tokens: 65536}
    curator:         {max_output_tokens: 65536}
    auditor:         {max_output_tokens: 65536}
    executor_weak:   {max_output_tokens: 5120}
    answerer:        {max_output_tokens: 5120}
