# TB21 frozen-split v2 re-distillation campaign (revision 3, 2026-10-13).
# Method source: docs/decisions/retrieval_delivery_tb_split_
# 20261013.md (revision 3, the user ruling: the TB re-run is a FULL v2
# re-distillation, not a filtered-bank reuse); stage 2/3 protocol in
# docs/decisions/stage23_protocol_v2_20261013.md. This experiment =
# stage 1 trajectory reuse + stages 2-6 FRESH v2 distillation: assemble
# with `expedistill assemble-reuse --level baseline`, which copies ONLY
# the train-41 two-arm stage-1 trajectories (plus the source run's
# accepted stage-1 infra shortfall, train side); every stage 2-6
# product is produced fresh under the CURRENT protocol. The
# mixed-protocol declaration of tb21_split_reuse.yaml therefore does NOT
# apply here: this run's G2 really calls the v2 prompts (no zero-call
# reuse downstream). The bank-level assembly (tb21_split_reuse.yaml)
# stays available as the optional filtered-bank ablation of revision 3
# item 6 and is not launched by this campaign.
#
# Method keys are verbatim copies of configs/experiments/
# tb21_full_v2.yaml except mode, split, rules and skill_delivery (the
# same copy discipline as tb21_split_reuse.yaml). The rules are the
# protocol v2 names: task_select any_weak_failed recomputes F on the
# train-41 side = 28 tasks (the v1 criterion all_valid_failed would say
# 16), segment_select strong_success_weak_failed, trajectory_select
# strong2_weak2.
#
# Split provenance: the three lists are bit-exact copies of the
# AgentBrew frozen split JSONs (seed 42, revision
# 2fd12b88aafdd04a52c298e3940bcb189f9766d6): train = evolve (41), test =
# test (28), reserved = validation (20); pairwise disjoint, union 89.
# Verify with scripts/run/freeze_tb_split.py. reserved is loaded but
# belongs to NEITHER arm: it is held out for development smokes only
# and the formal run never executes it.
