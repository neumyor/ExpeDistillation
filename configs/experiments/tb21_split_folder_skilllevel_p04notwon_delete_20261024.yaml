# Live P03/P05 deliver each pending task group as its own Agent Skills
# folder (progressive disclosure). P04/P06 decide per skill from the
# recorded read facts (skill_level) and attribute each triggered skill
# from bounded attempt windows. The P07 test phase keeps the existing
# folder delivery.
benchmark: tb
invalid_redispatch_limit: 1
mode: split
model_options:
  deepseek-v4-flash-0731--ali:
    reasoning_effort: max
models:
  answerer: qwen3.6-flash-distill
  auditor: deepseek-v4-flash-0731--ali
  author: deepseek-v4-flash-0731--ali
  curator: deepseek-v4-flash-0731--ali
  examiner: deepseek-v4-flash-0731--ali
  executor_strong: deepseek-v4-flash-0731--ali
  executor_weak: qwen3.6-flash-distill
  judge: deepseek-v4-flash-0731--ali
  rewriter: deepseek-v4-flash-0731--ali
  segmenter: deepseek-v4-flash-0731--ali
n_attempts_strong: 3
n_attempts_weak: 3
phases:
  live:
    acceptance: null
    compare:
      against: baseline
      rule: strict_rate_gain
    delivery:
      description_mode: summary_then_when_to_use
      name: folder_by_task
    execution:
      max_injection_tokens: null
      n_attempts: 3
      name: real
    kind: execute
    role: live
    tasks: train
  test:
    acceptance: null
    compare:
      against: external_campaign
      external:
        model_key: qwen
        path: ../seed/tb21_agentbrew_campaign_summary.json
        sha256: 1b5c483cebdc35d8c44c2370de2a76c4e6ef06f607fe9368e06815b730666da2
      rule: null
    delivery:
      description_mode: summary_then_when_to_use
      name: folder
    execution:
      name: real_folder
    kind: execute
    role: test
    tasks: test
  baseline:
    acceptance: null
    compare: null
    delivery:
      name: none
    execution:
      arms:
      - executor_strong
      - executor_weak
      name: real
    kind: execute
    role: baseline
    tasks: train
  learn:
    author:
      name: distill_diagnose
    decision:
      name: skill_level
      unread_in_won_group: delete
    curate:
      drop_low_value: false
      grouping_input: full
      merge_check: none
      name: agentbrew
      rounds: 3
      similarity_input: summary
      token_budget: null
    evidence:
      K: 5
      name: segment
      retry_limit: 2
      write_lessons: true
    kind: learn
    role: learn
prompts_digests: {}
rules:
  segment_select: strong_success_weak_failed
  task_select: any_weak_failed
  trajectory_select: strong1_weak1
