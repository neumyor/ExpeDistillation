# SearchQA live_run smoke (2026-10-17): 5 hand-picked items, the full
# two-round closed loop D L B L B L C against the REAL searchqa-eval
# environment, driven by the fake provider (EXPEDISTILL_LLM_PROVIDER=fake;
# plan: tmp/mm_smoke/fake_plan.json, regenerated by tmp/mm_smoke/gen_plan.py).
#
# The weak executor's scripted policies split the 4 train groups across
# the learn-phase flows: t1 keeps at round 0 ("skills"), t2/t3 miss
# round 0 and keep after the G10/G11 revision ("revised_skills"), t4
# misses both rounds and the last learn phase deletes it ("never").
# The test item passes with any skills block, so the C delta is
# positive when the bank carries anything. retry_limit=1 (the smoke's
# re-segmentation budget); every other knob is the documented default.
benchmark: searchqa
mode: split
models:
  executor_strong: fake-strong
  executor_weak: fake-weak
n_attempts_strong: 1
n_attempts_weak: 2
invalid_redispatch_limit: 1
tasks:
  - 221c83e6630f4e7983da48fa28da1882
  - a234f47261f14ab9aed867375bddc652
  - 3909c367f524402d8ba5ec2b520ba206
  - db15ab3b562142f1aa6e7cbb0a561e83
  - 979e3f5aac91446b8550161dd89e9e26
split:
  train:
    - 221c83e6630f4e7983da48fa28da1882
    - a234f47261f14ab9aed867375bddc652
    - 3909c367f524402d8ba5ec2b520ba206
    - db15ab3b562142f1aa6e7cbb0a561e83
  test:
    - 979e3f5aac91446b8550161dd89e9e26
rules:
  task_select: any_weak_failed
  segment_select: strong_success_weak_failed
  trajectory_select: strong2_weak2
token_budgets:
  default_max_output_tokens: 8192
  max_input_tokens: null
weak_profile: >-
  The weak model is a small distilled model. It follows short, concrete
  instructions well but submits a guess instead of searching when the
  trigger for a skill is phrased abstractly, and it often answers with a
  sentence instead of the short answer phrase. Write skills as short
  ordered steps with explicit triggers, e.g. when to search the
  question's key terms and how to phrase the final Finish[...] answer
  as a concise noun phrase.
sequence:
  - D
  - L
  - B
  - L
  - B
  - L
  - C
phases:
  D:
    kind: execute
    role: baseline
    tasks: train
    delivery:
      name: none
    execution:
      name: real
      arms:
        - executor_strong
        - executor_weak
  L:
    kind: learn
    evidence:
      name: segment
      K: 5
      retry_limit: 1
    author:
      name: distill_diagnose
    curate:
      name: agentbrew
      merge_check: none
      rounds: 1
      token_budget: 96000
  B:
    kind: execute
    role: live
    tasks: train
    delivery:
      name: group_by_task
    execution:
      name: real
      n_attempts: 2
      max_injection_tokens: null
    compare:
      against: D
      rule: strict_rate_gain
  C:
    kind: execute
    role: test
    tasks: test
    delivery:
      name: whole_bank
    execution:
      name: real
    compare:
      against: fresh_bare
      rule: null
schema_version: 4
