[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "expedistill"
version = "0.1.0"
description = "Distill strong-model trajectories into a skill bank that teaches a weak model"
readme = "README.md"
requires-python = ">=3.9,<3.12"
dependencies = [
  "openai>=1.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7,<9", "ruff>=0.6"]

[project.scripts]
expedistill = "expedistill.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live: tests that call real model endpoints or remote hosts (excluded by default)",
]
addopts = "-m 'not live'"

[tool.ruff.lint]
# All pyflakes checks, including unused imports/variables, plus syntax errors.
select = ["E9", "F"]
